<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amethyst — agents</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #10061f; --raised: #1a0f2e; --hover: #22163a; --text: #e6ddf6; --strong: #faf6ff; --dim: #9586b3; --line: #2c1f45; --accent: #b18cff; --ok: #a3c99a;
      --font: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; --mono: "Cascadia Mono", Consolas, monospace; }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: 0 0; background: var(--bg); color: var(--text); font: 13px/1.4 var(--font); overflow: hidden; }
    #top { position: absolute; inset: 0 0 auto; height: 38px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--raised); z-index: 2; }
    #top img { width: 20px; height: 20px; }
    #top b { color: var(--strong); font-weight: 650; margin-right: 8px; }
    #tabs { flex: 1; display: flex; gap: 4px; overflow: hidden; height: 100%; align-items: end; }
    .tab { flex: 0 0 auto; height: 28px; padding: 0 12px; display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-bottom: 0; border-radius: 6px 6px 0 0; background: var(--bg); color: var(--dim); font-size: 12px; animation: pop .35s cubic-bezier(.2, 1.6, .4, 1); }
    .tab.on { color: var(--strong); border-color: var(--accent); }
    #count { font: 600 12px var(--mono); color: var(--accent); min-width: 120px; text-align: right; }
    #deck { position: absolute; inset: 38px 0 0; }
    .card { position: absolute; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; background: var(--raised); overflow: hidden;
      transition: left .7s cubic-bezier(.6, 0, .2, 1), top .7s cubic-bezier(.6, 0, .2, 1), width .7s cubic-bezier(.6, 0, .2, 1), height .7s cubic-bezier(.6, 0, .2, 1), border-color .3s, transform .6s, opacity .6s; }
    .card.new { animation: pop .4s cubic-bezier(.2, 1.6, .4, 1); }
    .card .hd { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-bottom: 1px solid var(--line); background: var(--hover); font-size: 11px; white-space: nowrap; overflow: hidden; }
    .card .hd i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); animation: blink 1s infinite; flex: 0 0 auto; }
    .card .hd span { color: var(--strong); overflow: hidden; text-overflow: ellipsis; }
    .card .hd em { margin-left: auto; font-style: normal; color: var(--dim); font: 10px var(--mono); }
    .card .bd { flex: 1; padding: 5px 8px; font: 10px/1.5 var(--mono); color: var(--dim); overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
    .card .bd p { flex: 0 0 auto; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card .bd p:last-child { color: var(--text); }
    .card .bar { flex: 0 0 auto; height: 2px; background: var(--accent); width: 0; transition: width .4s; }
    .card.done { border-color: color-mix(in srgb, var(--ok) 60%, var(--line)); }
    .card.done .hd i { background: var(--ok); box-shadow: 0 0 6px var(--ok); animation: none; }
    .card.done .bar { background: var(--ok); }
    .card.done .bd p:last-child { color: var(--ok); }
    #over { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 5; }
    #ring { position: absolute; width: 700px; height: 700px; opacity: 0; transform: scale(.2); transition: opacity .5s, transform 1s cubic-bezier(.2, 1.4, .4, 1); }
    #ring svg { width: 100%; height: 100%; animation: spin 6s linear infinite; }
    #ring text { font: 700 46px var(--font); letter-spacing: 6px; fill: var(--accent); }
    #word { position: absolute; font: 800 82px/1 var(--font); color: var(--strong); letter-spacing: -2px; opacity: 0; transform: scale(.3); transition: opacity .4s, transform .8s cubic-bezier(.2, 1.5, .4, 1); text-shadow: 0 0 40px var(--accent), 0 0 120px var(--accent); }
    #over.on #ring, #over.on #word { opacity: 1; transform: scale(1); }
    #over.on #word { animation: throb .5s ease-in-out infinite alternate .8s; }
    #flash { position: absolute; inset: 0; background: var(--strong); opacity: 0; pointer-events: none; z-index: 6; }
    #flash.on { animation: flash .6s ease-out; }
    .bit { position: absolute; left: 640px; top: 360px; width: 10px; height: 10px; border-radius: 2px; z-index: 6; }
    #shout { position: absolute; left: 0; right: 0; top: 280px; text-align: center; font: 800 96px var(--font); color: var(--strong); text-shadow: 0 0 30px var(--accent); opacity: 0; transform: scale(.5); transition: opacity .3s, transform .5s cubic-bezier(.2, 1.6, .4, 1); z-index: 7; pointer-events: none; }
    #shout.on { opacity: 1; transform: scale(1); }
    #end { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; background: var(--bg); opacity: 0; transition: opacity .8s; z-index: 8; pointer-events: none; }
    #end.on { opacity: 1; }
    #end img { width: 120px; }
    #end h1 { margin: 0; font: 750 64px/1 var(--font); color: var(--strong); }
    #end p { margin: 0; font-size: 22px; color: var(--dim); }
    #end span { margin-top: 10px; padding: 8px 20px; border-radius: 8px; background: var(--accent); color: var(--bg); font-weight: 650; font-size: 18px; }
    #stage.shake { animation: shake .4s linear infinite; }
    @keyframes pop { from { transform: scale(.3); opacity: 0; } }
    @keyframes blink { 50% { opacity: .35; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes throb { to { transform: scale(1.08); } }
    @keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }
    @keyframes shake { 25% { translate: 4px -3px; } 50% { translate: -4px 2px; } 75% { translate: 3px 4px; } }
  </style>
</head>
<body>
<div id="stage">
  <div id="top"><img src="amethyst.svg" alt=""><b>Amethyst</b><div id="tabs"></div><div id="count"></div></div>
  <div id="deck"></div>
  <div id="over">
    <div id="ring"><svg viewBox="0 0 640 640"><defs><path id="circle" d="M320,320 m-260,0 a260,260 0 1,1 520,0 a260,260 0 1,1 -520,0"/></defs>
      <text><textPath href="#circle" textLength="1625" lengthAdjust="spacing">CLAUDING · CLAUDING · CLAUDING · CLAUDING ·</textPath></text></svg></div>
    <div id="word">CLAUDING…</div>
  </div>
  <div id="shout"></div>
  <div id="flash"></div>
  <div id="end"><img src="amethyst.svg" alt=""><h1>Amethyst</h1><p>Where your thoughts crystallize</p><span>desktop app · soon</span></div>
</div>
<script type="module" src="site/demo.ts"></script>
</body>
</html>
